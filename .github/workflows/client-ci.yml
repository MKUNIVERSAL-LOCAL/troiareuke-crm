name: client-ci

# 지점 프로그램(프론트) 검증 게이트 — main에 코드가 들어올 때마다
# 타입검사 + 프로덕션 빌드 + 죽은 라우트 검사를 자동 수행해 회귀를 머지 단계에서 차단한다.
on:
  push:
    paths:
      - 'src/**'
      - 'electron/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'scripts/check-routes.mjs'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.env.e2e'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'electron/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'scripts/check-routes.mjs'
      - '.github/workflows/client-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check + production build (tsc && vite build)
        run: npm run build
      - name: Dead-route static check
        run: node scripts/check-routes.mjs
      - name: Distribution invariants (no-redownload policy)
        run: node scripts/check-distribution-invariants.mjs

  # 핵심 사용 흐름 E2E 스모크 (파일럿 준비 5/5) — 로컬 모드 빌드를 브라우저로 통과시켜
  # 가입→온보딩→고객 등록→예약→결제가 릴리스마다 깨지지 않았음을 보장한다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build (local mode, .env.e2e)
        run: npm run build:e2e
      - name: Run E2E smoke
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
