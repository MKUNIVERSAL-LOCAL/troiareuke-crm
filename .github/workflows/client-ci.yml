name: client-ci

# 지점 프로그램(프론트) 검증 게이트 — main에 코드가 들어올 때마다
# 타입검사 + 프로덕션 빌드 + 죽은 라우트 검사를 자동 수행해 회귀를 머지 단계에서 차단한다.
on:
  push:
    paths:
      - 'src/**'
      - 'electron/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'scripts/check-routes.mjs'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.env.e2e'
      - '.env.e2e-nas'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'electron/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'scripts/check-routes.mjs'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.env.e2e'
      - '.env.e2e-nas'
      - '.github/workflows/client-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 357(352~354 리뷰 H-1): 기록 검증 가드(check:docs)는 묶음 줄이 적어 둔 **커밋 해시가 실재하는지**
      # git 에 묻는다. 기본 checkout 은 깊이 1이라 그 해시를 하나도 찾지 못해 "확인할 수 없는 기록 111건"
      # 으로 멈췄고, 이 게이트는 **100회 연속 빨갰다**. 같은 이유로 시각 검사(⑱)는 커밋 하나만 얻어
      # 묶음·재검증 줄 전부를 조용히 건너뛰었다 — 신고 0건이라 꺼진 것조차 보이지 않았다.
      # (360: 여기 "194줄" 이라고 적었다가 뺐다 — 그 수는 묶음마다 늘어 주석이 거짓이 된다.)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 묶음 해시를 git 에 물어야 한다(얕은 클론이면 ①·⑱ 이 거짓으로 실패·무음이 된다)
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @axe-core/playwright 4.14 engines >=22.12
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check + production build (tsc && vite build)
        run: npm run build
      - name: Dead-route static check
        run: node scripts/check-routes.mjs
      - name: 순수 규칙 커버리지(테스트가 안 부르는 공식 금지)
        run: npm run check:rules
      - name: 화면 칸 커버리지(스펙이 안 보는 새 testid 금지)
        run: npm run check:testids
      - name: 기록 검증(확인할 수 없는 주장 금지)
        run: npm run check:docs
      - name: GAP 표 검증(낡은 계획 금지 — 상태 기호·묶음 번호·위치 파일·완료 기준)
        run: npm run check:gap
      # 360(355~359 리뷰 L-6): check:notes 만 머지 관문에 없었다 — 지점이 배너로 읽는 글의
      # 거짓 인용(355 가 고친 종류)이 릴리스 직전에만 걸렸다. 비용은 거의 0 이다.
      - name: 릴리스 노트 검증(지점이 읽는 배너 — 절 크기·구분선·첫 줄 버전)
        run: npm run check:notes
      - name: 설정 저장 판정(판정을 버리고 "저장했습니다" 금지)
        run: npm run check:save
      - name: 장식 UI 금지(동작 없는 단추·입력칸)
        run: npm run check:decorative
      - name: 미사용 export 금지(죽은 코드)
        run: npm run check:dead-export
      - name: 창 접근성 커버리지(게이트가 안 여는 새 창 금지)
        run: npm run check:modal-a11y
      - name: 키보드 경로(마우스로만 쓸 수 있는 자리 금지)
        run: npm run check:keyboard
      - name: 글자 대비(흰 글자가 얹힌 배경색 기준 미달 금지)
        run: npm run check:contrast

      - name: 보이지 않는 글자 검사 (제어문자·폭 없는 글자)
        run: npm run check:invisible

      - name: 스펙 관례(UTC 날짜로 "오늘" 을 만들면 한국 시간 00~09시에 빨갛다)
        run: npm run check:e2e-conv

      - name: 초점 표시(전역 키보드 초점 링이 유틸보다 뒤에 오는지 — 빌드 뒤에 본다)
        run: npm run check:focus
      - name: E2E spec type check (e2e/tsconfig.json, strict + unused)
        run: npm run check:e2e-types
      - name: Distribution invariants (no-redownload policy)
        run: node scripts/check-distribution-invariants.mjs

  # 핵심 사용 흐름 E2E 스모크 (파일럿 준비 5/5) — 로컬 모드 빌드를 브라우저로 통과시켜
  # 가입→온보딩→고객 등록→예약→결제가 릴리스마다 깨지지 않았음을 보장한다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @axe-core/playwright 4.14 engines >=22.12
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build (local mode, .env.e2e)
        run: npm run build:e2e
      - name: Run E2E smoke
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
