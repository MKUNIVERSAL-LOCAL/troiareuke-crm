name: mobile-android

# 모바일 앱(안드로이드) 빌드 — 릴리스(v*)마다 자동. PC에 Android SDK가 없어도 스토어 제출용 AAB와 파일럿용 APK가 나온다.
# 서명: 시크릿 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 가 있으면 릴리스 서명,
#       없으면 debug 서명 APK만(설치·파일럿 가능, 스토어 업로드 불가). 키스토어는 한 번 만들면 영구 보관(분실 = 앱 업데이트 불가).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web bundle for Capacitor (BUILD_TARGET=capacitor -> dist-mobile)
        run: npm run build:mobile
      - name: Sync native project + version (package.json -> versionCode/versionName)
        run: |
          node scripts/sync-mobile-version.mjs
          npx cap sync android
      - name: Decode keystore (if provided)
        id: keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle build (release AAB + APK, or debug APK without keystore)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
            cp app/build/outputs/bundle/release/app-release.aab ../TroiareukeCRM-android.aab
            cp app/build/outputs/apk/release/app-release.apk ../TroiareukeCRM-android.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../TroiareukeCRM-android.apk
            echo "::warning::서명 키스토어 시크릿이 없어 debug APK만 생성 (스토어 제출 불가, 파일럿 설치는 가능)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            TroiareukeCRM-android.apk
            TroiareukeCRM-android.aab
          if-no-files-found: error
          retention-days: 30
      - name: Attach to GitHub Release (mobile-latest.json apkUrl target)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" TroiareukeCRM-android.apk --clobber
          if [ -f TroiareukeCRM-android.aab ]; then
            gh release upload "${{ github.event.release.tag_name }}" TroiareukeCRM-android.aab --clobber
          fi
